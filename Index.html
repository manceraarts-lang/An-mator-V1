<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Editorial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0b0b12; color: #eee; min-height: 100vh; }
  header { padding: 20px 24px; background: linear-gradient(180deg,#1a1a2e,transparent); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 1.4rem; color: #e50914; letter-spacing: 1px; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 16px; }
  .card { background: #16161f; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform .2s; }
  .card:hover { transform: scale(1.04); }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #222; }
  .card .meta { padding: 10px; }
  .card .meta h3 { font-size: .9rem; margin-bottom: 4px; }
  .card .meta p { font-size: .75rem; color: #888; }
  #reader { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
  #reader.open { display: flex; }
  #reader .topbar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
  #reader .topbar h2 { font-size: 1rem; }
  #reader .topbar button { background: #e50914; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  #reader .pages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #reader .pages img { max-width: 100%; border-radius: 6px; background: #111; }
  .loading { color: #666; padding: 40px; text-align: center; }
</style>
</head>
<body>
<header><h1>🎬 Mi Editorial</h1></header>
<main>
  <div class="grid" id="grid"><p class="loading">Cargando catálogo...</p></div>
</main>

<div id="reader">
  <div class="topbar">
    <h2 id="readerTitle">—</h2>
    <button id="btnClose">Cerrar ✕</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script>
const CATALOG_URL = 'Cómics.json'; // ojo: C mayúscula, igual que tu archivo

async function loadCatalog() {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch(CATALOG_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error('No se pudo cargar ' + CATALOG_URL);
    const comics = await res.json();
    grid.innerHTML = '';
    if (comics.length === 0) {
      grid.innerHTML = '<p class="loading">Aún no hay cómics publicados.</p>';
      return;
    }
    comics.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${c.portada}" alt="${c.titulo}" loading="lazy">
        <div class="meta">
          <h3>${c.titulo} #${c.numero || ''}</h3>
          <p>${c.sinopsis || ''}</p>
        </div>`;
      card.addEventListener('click', () => openReader(c));
      grid.appendChild(card);
    });
  } catch (e) {
    grid.innerHTML = '<p class="loading">Error: ' + e.message + '</p>';
  }
}

function openReader(comic) {
  const reader = document.getElementById('reader');
  const title = document.getElementById('readerTitle');
  const pages = document.getElementById('pages');
  reader.classList.add('open');
  title.textContent = comic.titulo + (comic.numero ? ' #' + comic.numero : '');
  pages.innerHTML = '<p class="loading">Cargando páginas...</p>';
  setTimeout(() => {
    pages.innerHTML = '';
    (comic.paginas || []).forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      pages.appendChild(img);
    });
  }, 300);
}

document.getElementById('btnClose').addEventListener('click', () => {
  document.getElementById('reader').classList.remove('open');
});

loadCatalog();
</script>
</body>
</html>
